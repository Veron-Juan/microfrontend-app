# Render Blueprint for news-ssr, the only remote that needs a server.
# In Render: New → Blueprint → this repo. It redeploys by itself on every push to main that touches it.
services:
  - type: web
    name: mfe-anatomia-news
    runtime: docker
    plan: free
    branch: main
    autoDeploy: true
    # The Dockerfile is built from the root, because it uses the @mfe/design-tokens package.
    dockerfilePath: ./apps/news-ssr/Dockerfile
    dockerContext: .
    healthCheckPath: /health
    buildFilter:
      paths:
        - apps/news-ssr/**
        - packages/design-tokens/**
        - package.json
        - package-lock.json
    envVars:
      # The time zone for the match kickoff times (for example, America/Argentina/Buenos_Aires).
      # Render asks for it when creating the service.
      - key: TZ
        sync: false
