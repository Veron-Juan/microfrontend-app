name: CI

on:
  push:
    branches: [main]
  pull_request:

# The jobs' GitHub token can only read the repo: none of them needs to write to it.
permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run figures
      - run: npm run check
      - run: npm run build

  # The four static sites go to Cloudflare (Workers with static assets; each app has its own
  # wrangler.jsonc). news-ssr isn't here: Render deploys it by itself from render.yaml. The origins
  # are repo variables, so changing one doesn't touch the code.
  deploy:
    needs: check
    # Skipped until the repo has the origins configured.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.MFE_NEWS_ORIGIN != ''
    runs-on: ubuntu-latest
    concurrency: production
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      MFE_NEWS_ORIGIN: ${{ vars.MFE_NEWS_ORIGIN }}
      MFE_CATALOG_ORIGIN: ${{ vars.MFE_CATALOG_ORIGIN }}
      MFE_DETAILS_ORIGIN: ${{ vars.MFE_DETAILS_ORIGIN }}
      MFE_GUIDE_ORIGIN: ${{ vars.MFE_GUIDE_ORIGIN }}
      DEPLOY: npx --yes wrangler@4.146.0 deploy --cwd
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run figures

      # The remotes first: by the time the new shell ships, what its discovery announces already exists.
      - name: catalog
        run: |
          PUBLIC_URL="${MFE_CATALOG_ORIGIN%/}/" npm run build -w catalog
          $DEPLOY apps/catalog
      - name: details
        run: |
          PUBLIC_URL="${MFE_DETAILS_ORIGIN%/}/" npm run build -w details
          $DEPLOY apps/details
      - name: guide-ssg
        run: |
          npm run build -w guide-ssg
          $DEPLOY apps/guide-ssg

      # The shell last, with the production discovery. If an origin is missing or isn't https, it fails here.
      - name: shell
        run: |
          npm run build -w shell
          npm run discovery -w shell
          $DEPLOY apps/shell
