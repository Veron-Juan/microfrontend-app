name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run figures
      - run: npm run check
      - run: npm run build

  # Los cuatro sitios estáticos van a Cloudflare (Workers con archivos estáticos; cada app tiene su
  # wrangler.jsonc). news-ssr no está aquí: Render lo despliega solo desde render.yaml. Los orígenes
  # son variables del repo, así que cambiar uno no toca el código.
  deploy:
    needs: check
    # Se salta hasta que el repo tenga configurados los orígenes.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.MFE_NEWS_ORIGIN != ''
    runs-on: ubuntu-latest
    concurrency: production
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      MFE_NEWS_ORIGIN: ${{ vars.MFE_NEWS_ORIGIN }}
      MFE_CATALOG_ORIGIN: ${{ vars.MFE_CATALOG_ORIGIN }}
      MFE_DETAILS_ORIGIN: ${{ vars.MFE_DETAILS_ORIGIN }}
      MFE_GUIDE_ORIGIN: ${{ vars.MFE_GUIDE_ORIGIN }}
      DEPLOY: npx --yes wrangler@4.146.0 deploy --cwd
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run figures

      # Primero los remotes: cuando se publica el shell nuevo, lo que su discovery anuncia ya existe.
      - name: catalog
        run: |
          PUBLIC_URL="${MFE_CATALOG_ORIGIN%/}/" npm run build -w catalog
          $DEPLOY apps/catalog
      - name: details
        run: |
          PUBLIC_URL="${MFE_DETAILS_ORIGIN%/}/" npm run build -w details
          $DEPLOY apps/details
      - name: guide-ssg
        run: |
          npm run build -w guide-ssg
          $DEPLOY apps/guide-ssg

      # El shell al final, con el discovery de producción. Si falta un origen o no es https, falla aquí.
      - name: shell
        run: |
          npm run build -w shell
          npm run discovery -w shell
          $DEPLOY apps/shell
